[package]
name = "diskguard"
version = "0.1.0"
description = "DiskGuard - 基于 Sandboxie 核心的磁盘访问限制器"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
chrono = "0.4"
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
